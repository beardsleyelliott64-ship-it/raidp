services:
  - type: web
    name: eamai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: SUPABASEURL
        sync: false
      - key: SUPABASEKEY
        sync: false
      - key: STARTUP_WEBHOOK_URL
        sync: false
      - key: ERROR_WEBHOOK_URL
        sync: false
      - key: LOGS_WEBHOOK_URL
        sync: false
      - key: SENAI_CHANNEL_ID
        sync: false
      - key: LANGUAGENUT_CHANNEL_ID
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
