services:
  - type: worker
    name: senai-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: GUILD_ID
        sync: false
      - key: PANEL_CHANNEL_ID
        sync: false
      - key: FREE_CHANNEL_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: VERIFY_CHANNEL_ID
        sync: false
    # Uncomment below on a paid Render plan for persistent SQLite
    # disk:
    #   name: senai-data
    #   mountPath: /data
    #   sizeGB: 1
