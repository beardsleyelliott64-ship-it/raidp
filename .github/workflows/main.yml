name: Install Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    name: Install Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . \
            -maxdepth 3 \
            -type f \
            -iname '*.zip' \
            ! -path './.git/*' \
            ! -path './.github/*' \
            | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            echo "::error::No project ZIP was found."
            echo "Upload the project ZIP to the repository and run this workflow again."
            exit 1
          fi

          echo "Found project ZIP: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Prepare extraction directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _project
          mkdir -p _project

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "$ZIP_PATH" -d _project
          echo "Extracted project contents:"
          find _project -maxdepth 3 -type f -print | head -200

      - name: Find project root
        shell: bash
        run: |
          set -euo pipefail

          # Python project: look for bot.py or requirements.txt
          if [ -f "_project/bot.py" ] || [ -f "_project/requirements.txt" ]; then
            ROOT="_project"
          else
            ENTRY="$(find _project \
              -type f \
              \( -name 'bot.py' -o -name 'requirements.txt' -o -name 'main.py' \) \
              | head -n 1 || true)"

            if [ -z "$ENTRY" ]; then
              echo "::error::No bot.py or requirements.txt found inside the ZIP."
              exit 1
            fi

            ROOT="$(dirname "$ENTRY")"
          fi

          echo "Project root: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Install project files
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            "$PROJECT_ROOT/" ./

      - name: Remove installer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _project
          if [ -n "${ZIP_PATH:-}" ] && [ -f "$ZIP_PATH" ]; then
            rm -f "$ZIP_PATH"
          fi

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking installed project..."

          if [ ! -f bot.py ] && [ ! -f main.py ]; then
            echo "::error::No bot.py or main.py was found."
            exit 1
          fi

          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt is missing."
            exit 1
          fi

          echo
          echo "===== requirements.txt ====="
          cat requirements.txt

          echo
          echo "===== Project files ====="
          find . \
            -maxdepth 3 \
            -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            | sort

          echo
          echo "Project verification successful."

      - name: Stage project changes
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git restore --staged .github/ 2>/dev/null || true
          echo "Staged changes:"
          git diff --cached --name-status

      - name: Commit project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No project changes need committing."
            exit 0
          fi

          git commit -m "Install project"

      - name: Push project
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
