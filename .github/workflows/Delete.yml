name: Delete Project Files

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE to confirm"
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-project:
    name: Delete Project
    if: ${{ inputs.confirmation == 'DELETE' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Deleting project files..."
          echo "Keeping .git and .github..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          echo "Project files deleted."

      - name: Verify workflows
        shell: bash
        run: |
          set -euo pipefail

          echo "Workflows remaining:"
          find .github/workflows \
            -maxdepth 1 \
            -type f \
            -print 2>/dev/null || true

      - name: Stage deletion
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          # Never stage or modify GitHub workflow files.
          git restore --staged .github/ 2>/dev/null || true

          echo "Changes to be committed:"
          git diff --cached --name-status

      - name: Commit deletion
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "Nothing to delete."
            exit 0
          fi

          git commit -m "Delete project files"

      - name: Push deletion
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main
