[phases.setup]
nixPkgs = ["python311", "nodejs_20", "ffmpeg"]

[phases.install]
cmds = [
  "python3.11 -m venv /opt/venv",
  "/opt/venv/bin/pip install --no-cache-dir -r requirements.txt",
  "apt-get update -qq && apt-get install -y --no-install-recommends libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdbus-1-3 libgbm1 libgtk-3-0t64 libnspr4 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxss1 libxtst6 libx11-xcb1 libxcb-dri3-0",
  "/opt/venv/bin/playwright install chromium",
  "/opt/venv/bin/python -c \"from playwright.async_api import async_playwright; print('[build] playwright OK')\""
]

[start]
cmd = "/opt/venv/bin/python bot.py"
