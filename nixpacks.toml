[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg"]

[phases.install]
cmds = [
  "apt-get update -qq && apt-get install -y --no-install-recommends python3.12 python3.12-venv python3-pip libstdc++6 libgcc-s1 libasound2t64 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdbus-1-3 libgbm1 libgtk-3-0t64 libnspr4 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxss1 libxtst6 libx11-xcb1 libxcb-dri3-0",
  "python3.12 -m venv /opt/venv",
  "/opt/venv/bin/pip install --no-cache-dir -r requirements.txt",
  "/opt/venv/bin/playwright install chromium",
  "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu /opt/venv/bin/python -c \"from playwright.async_api import async_playwright; print('[build] playwright OK')\""
]

[start]
cmd = "bash start.sh"
